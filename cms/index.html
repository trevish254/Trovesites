<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trovesites content management system">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>CMS — Trovesites</title>
  <link rel="stylesheet" href="../trovex-ops-7c4b/admin.css?v=20260919-4">
  <script src="../theme-init.js?v=20260921-1"></script>
  <link rel="stylesheet" href="../styles.css?v=20260921-19">
</head>
<body>
  <main class="admin-shell">
    <section class="auth-panel" id="auth-panel" aria-labelledby="auth-title">
      <a class="brand" href="../index.html"><img src="../assets/trovesites-logo.jpg" alt=""> <span>Trovesites</span></a>
      <div class="auth-mark">✦</div>
      <p class="eyebrow">Private workspace</p>
      <h1 id="auth-title">Admin sign in.</h1>
      <p class="intro">Sign in to continue to the Trovesites CMS.</p>
      <p class="form-message" id="form-message" role="status" hidden></p>
      <form id="admin-login-form" class="admin-form" onsubmit="event.preventDefault(); var status = document.querySelector('#form-message'); if (status) { status.hidden = false; status.textContent = 'Signing in…'; } if (window.handleAdminLogin) window.handleAdminLogin(event); else if (status) { status.textContent = 'CMS authentication script did not load. Reload this page.'; status.dataset.error = 'true'; } return false;">
        <label>Admin email<input id="admin-email" name="cms-admin-email" type="email" autocomplete="off" data-lpignore="true" data-1p-ignore="true" required></label>
        <label>Admin password<input id="admin-password" name="cms-admin-password" type="password" autocomplete="new-password" data-lpignore="true" data-1p-ignore="true" required></label>
        <button class="primary-button" id="enter-workspace" type="submit">Enter CMS</button>
        <button class="google-button" type="button" id="admin-google"><strong>G</strong> Continue with Google</button>
      </form>
      <a class="back-link" href="../index.html">← Return to site</a>
    </section>
    <section id="dashboard" hidden></section>
  </main>
  <script>
    const showCmsRuntimeError = (text) => {
      const status = document.querySelector('#form-message');
      if (status) { status.hidden = false; status.dataset.error = 'true'; status.textContent = text; }
    };
    window.addEventListener('error', (event) => showCmsRuntimeError(`CMS script error: ${event.message || 'unknown error'}`));
    window.addEventListener('unhandledrejection', (event) => showCmsRuntimeError(`CMS startup error: ${event.reason?.message || event.reason || 'unknown error'}`));
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-client.js?v=20260920-2"></script>
  <script src="../cms-ui.js?v=20260921-31"></script>
  <script src="../trovex-ops-7c4b/admin.js?v=20260921-1"></script>
</body>
</html>
