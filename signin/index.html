<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solace — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signin.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0YX88N3LFR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0YX88N3LFR');
  </script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <main class="signin-scene" id="scene">
    <div class="signin-center">
      <section class="glass-card" id="glass-card">
        <div class="signin-content">
          <div class="fade-up logo-mark"><img src="../assets/trovesites-logo.jpg" alt="Trovesites"></div>
          <h1 class="fade-up delay-1">Step back in!</h1>
          <p class="fade-up delay-2 subtitle">Log in to continue your mindful exercises, calm routines, and wellness<br class="desktop-break"> pathway</p>
          <form id="signin-form" class="signin-form">
            <div class="fade-up delay-3 field"><label for="email">Email</label><input id="email" type="email" placeholder="Your email address" autocomplete="email" required></div>
            <div class="fade-up delay-4 field"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" placeholder="Type your password" autocomplete="current-password" required><button type="button" id="toggle-password" aria-label="Show password">◉</button></div></div>
            <div class="fade-up delay-5 account-row"><label class="check-label"><input type="checkbox"><span class="checkmark">✓</span>Stay signed in</label><button type="button" class="text-button">Reset password?</button></div>
            <button class="fade-up delay-6 primary-button" type="submit">Sign in</button>
            <div class="fade-up delay-7 divider"><span></span><b>Or</b><span></span></div>
            <button class="fade-up delay-8 google-button" type="button"><strong>G</strong>Continue with Google</button>
            <p class="fade-up delay-9 join-copy">New to this platform? <button type="button" class="join-button">Join Now</button></p>
          </form>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-client.js"></script>
  <script src="../auth.js?v=20260921-1"></script>
  <script src="signin.js"></script>
</body>
</html>
